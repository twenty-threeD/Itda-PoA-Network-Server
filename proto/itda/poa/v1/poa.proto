syntax = "proto3";
package itda.poa.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/twenty-threeD/Itda-PoA-Network-Server/x/poa/types";

// Params defines the parameters of the Proof-of-Authority module.
message Params {
  option (amino.name) = "itda/x/poa/Params";
  option (gogoproto.equal) = true;

  // max_validators is the maximum number of validators allowed in the active
  // set. Adding a validator beyond this limit is rejected.
  uint32 max_validators = 1;

  // default_power is the consensus voting power assigned to a validator when
  // MsgAddValidator does not specify one explicitly.
  int64 default_power = 2;
}

// Validator is a single authority-approved consensus node.
message Validator {
  option (gogoproto.equal) = true;

  // operator_address is the bech32 account address that controls this
  // validator entry. It is the primary key of the validator set.
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // consensus_pubkey is the public key CometBFT uses to identify this node
  // when signing blocks. Must implement cosmos.crypto.PubKey.
  google.protobuf.Any consensus_pubkey = 2 [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];

  // moniker is a human-readable label for operators and explorers.
  string moniker = 3;

  // power is the consensus voting power handed to CometBFT. Under pure PoA
  // this is typically 1 for every validator, giving each authority an equal
  // vote, but unequal weights are permitted.
  int64 power = 4;
}
