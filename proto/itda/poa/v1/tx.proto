syntax = "proto3";
package itda.poa.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "itda/poa/v1/poa.proto";

option go_package = "github.com/twenty-threeD/Itda-PoA-Network-Server/x/poa/types";

// Msg defines the state-changing entry points of the PoA module. Every method
// is gated on the module authority, which is what makes the chain permissioned.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // AddValidator admits a new node into the active validator set.
  rpc AddValidator(MsgAddValidator) returns (MsgAddValidatorResponse);

  // RemoveValidator evicts a node from the active validator set.
  rpc RemoveValidator(MsgRemoveValidator) returns (MsgRemoveValidatorResponse);

  // UpdateParams sets the module parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgAddValidator admits a new validator to the authority set.
message MsgAddValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "itda/x/poa/MsgAddValidator";

  // authority is the address permitted to change the validator set. This is
  // the gov module account when the chain is governed on-chain, or a plain
  // admin address for a consortium deployment.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // operator_address is the account that will control the new validator entry.
  string operator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // consensus_pubkey is the CometBFT signing key of the new node.
  google.protobuf.Any consensus_pubkey = 3 [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];

  // moniker is a human-readable label for the new validator.
  string moniker = 4;

  // power is the voting power to assign. Zero means use Params.default_power.
  int64 power = 5;
}

// MsgAddValidatorResponse is the response type of Msg/AddValidator.
message MsgAddValidatorResponse {}

// MsgRemoveValidator evicts a validator from the authority set.
message MsgRemoveValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "itda/x/poa/MsgRemoveValidator";

  // authority is the address permitted to change the validator set.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // operator_address identifies the validator to remove.
  string operator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRemoveValidatorResponse is the response type of Msg/RemoveValidator.
message MsgRemoveValidatorResponse {}

// MsgUpdateParams sets the module parameters.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "itda/x/poa/MsgUpdateParams";

  // authority is the address permitted to change module parameters.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params replaces the module parameters in full.
  Params params = 2 [(gogoproto.nullable) = false];
}

// MsgUpdateParamsResponse is the response type of Msg/UpdateParams.
message MsgUpdateParamsResponse {}
