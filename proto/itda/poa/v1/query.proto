syntax = "proto3";
package itda.poa.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "itda/poa/v1/poa.proto";

option go_package = "github.com/twenty-threeD/Itda-PoA-Network-Server/x/poa/types";

// Query defines the read-only entry points of the PoA module.
service Query {
  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/itda/poa/v1/params";
  }

  // Validators returns the full active authority set, paginated.
  rpc Validators(QueryValidatorsRequest) returns (QueryValidatorsResponse) {
    option (google.api.http).get = "/itda/poa/v1/validators";
  }

  // Validator returns a single validator by operator address.
  rpc Validator(QueryValidatorRequest) returns (QueryValidatorResponse) {
    option (google.api.http).get = "/itda/poa/v1/validators/{operator_address}";
  }
}

// QueryParamsRequest is the request type of Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse is the response type of Query/Params.
message QueryParamsResponse {
  // params holds the current module parameters.
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryValidatorsRequest is the request type of Query/Validators.
message QueryValidatorsRequest {
  // pagination defines the page to return.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryValidatorsResponse is the response type of Query/Validators.
message QueryValidatorsResponse {
  // validators is the requested page of the active authority set.
  repeated Validator validators = 1 [(gogoproto.nullable) = false];

  // pagination defines the page actually returned.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryValidatorRequest is the request type of Query/Validator.
message QueryValidatorRequest {
  // operator_address identifies the validator to fetch.
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryValidatorResponse is the response type of Query/Validator.
message QueryValidatorResponse {
  // validator is the requested validator entry.
  Validator validator = 1 [(gogoproto.nullable) = false];
}
