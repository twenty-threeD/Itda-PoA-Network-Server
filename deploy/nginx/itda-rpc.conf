# Itda PoA — CometBFT RPC 공개 프록시
#
# 목적
#   1) 프론트엔드 서버(Next.js 라우트 핸들러)가 /net_info 로 피어 수를 조회한다.
#   2) 브라우저가 /websocket 으로 NewBlock 을 구독해 블록 높이를 실시간 표시한다.
#   그 외 모든 RPC 메서드는 403 으로 차단한다.
#
# 배치 (Rocky Linux — sites-enabled 구조가 없다)
#   /etc/nginx/conf.d/itda-rpc.conf
#
#   SELinux 가 Enforcing 이면 nginx 의 업스트림 연결이 막혀 502 가 난다.
#   sudo setsebool -P httpd_can_network_connect 1
#
# 전제
#   config.toml 의 [rpc] laddr 는 tcp://127.0.0.1:26657 (기본값) 로 두고
#   cors_allowed_origins 는 비워 둔다. 오리진 검증은 여기서만 한다.
#   방화벽에서 26657 은 외부에 닫아 둔다.
#
# 같은 서버의 blockchain.conf 와 공존한다.
#   - blockchain.conf 가 default_server(server_name _)로 미매칭 SNI 를 444 로
#     끊는다. 이 파일이 없으면 rpc.idta.store 도 거기로 떨어져 인증서가
#     어긋나고 Cloudflare 가 526 을 낸다.
#   - zone 이름(itda_rpc, itda_ws)과 upstream 이름(itda_cometbft)은
#     blockchain.conf 와 겹치지 않는다.
#
# ── 치환 대상 ────────────────────────────────────────────────────────────
#   rpc.idta.store              이 프록시의 공개 도메인
#   https://www.idta.store      브라우저 WebSocket 을 허용할 프론트 오리진
# ────────────────────────────────────────────────────────────────────────

# 앞단에 Cloudflare 가 있으면 $remote_addr 이 전부 Cloudflare IP 라
# 레이트 리밋이 무의미해진다. CF-Connecting-IP 를 우선 사용한다.
map $http_cf_connecting_ip $itda_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# WebSocket 을 허용할 오리진 화이트리스트.
# 오리진이 늘어나면 여기에 줄을 추가한다.
map $http_origin $itda_ws_allowed {
    default                    0;
    "https://www.idta.store"   1;
    "https://idta.store"       1;
}

limit_req_zone $itda_client_ip zone=itda_rpc:10m rate=5r/s;

# WebSocket 은 연결당 1회만 열리므로 커넥션 수로 제한한다.
limit_conn_zone $itda_client_ip zone=itda_ws:10m;

upstream itda_cometbft {
    server 127.0.0.1:26657;
    keepalive 16;
}

# Cloudflare 는 443 으로만 오리진에 연결한다. 80 은 직접 접근한 경우를 위한
# 리다이렉트로만 남겨 둔다.
server {
    listen 80;
    listen [::]:80;
    server_name rpc.idta.store;

    return 301 https://$host$request_uri;
}

server {
    # http2 on; 은 nginx 1.25.1+ 문법이다. Rocky 9 기본 nginx(1.20)와
    # 기존 blockchain.conf 스타일에 맞춰 구형 표기를 쓴다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc.idta.store;

    # Cloudflare Origin Certificate (15년 유효, 갱신 불필요).
    # Cloudflare 대시보드 > SSL/TLS > Origin Server 에서 발급한다.
    # SSL/TLS 모드는 Full (strict) 로 둔다.
    ssl_certificate     /etc/nginx/ssl/idta-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/idta-origin.key;

    # Authenticated Origin Pulls — Cloudflare 를 거치지 않은 직접 연결을 거부한다.
    # 오리진 IP 가 노출돼도 우회 접근을 막을 수 있다. 활성화하려면 아래 두 줄의
    # 주석을 풀고 Cloudflare 의 origin-pull CA 인증서를 내려받아 둔다.
    # ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # 노드 정보를 흘리지 않는다.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 8k;
    proxy_buffering on;

    # ── 서버 → 서버 조회 ─────────────────────────────────────────────
    #   /net_info    피어 수. Next 라우트 핸들러(CHAIN_RPC_URL)가 호출한다.
    #   /status      최신 높이·시각. 진단 및 예비용.
    #   /validators  검증자 수. 평소에는 SDK REST 쪽을 쓴다.
    #   /block       임의 높이 블록 헤더. 평균 블록타임 계산의 예비 경로.
    #
    # 브라우저가 아니라 Next 서버가 호출하므로 CORS 헤더가 필요 없다.
    # (프론트는 같은 오리진의 /api/blockchain/* 만 호출한다.)
    location ~ ^/(net_info|status|validators|block)$ {
        limit_req zone=itda_rpc burst=20 nodelay;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        proxy_pass http://itda_cometbft;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;

        # 지표는 초 단위로만 바뀐다. 노드 부하를 막기 위해 짧게 캐싱.
        add_header Cache-Control "public, max-age=3" always;
    }

    # ── WebSocket 구독 (실시간 블록 높이) ────────────────────────────
    # 브라우저가 직접 붙는 유일한 경로다. WebSocket 은 CORS 프리플라이트를
    # 타지 않으므로 Origin 헤더를 직접 검증한다.
    location = /websocket {
        if ($itda_ws_allowed = 0) { return 403; }

        limit_conn itda_ws 4;

        proxy_pass http://itda_cometbft;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 구독은 장시간 유지된다. 유휴 타임아웃을 늘린다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # 그 외 전부 차단 — broadcast_tx_*, dump_consensus_state,
    # unsafe_flush_mempool, 루트로 오는 JSON-RPC POST 포함.
    location / { return 403; }
}
